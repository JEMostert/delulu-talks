[env]
# delulu-engine links one ggml, built by llama-cpp-sys-2, for llama.cpp, the YuE2
# code and acestep.cpp (crates/music-ace). acestep.cpp's DiT tensor names need a
# GGML_MAX_NAME above ggml's default 64, which changes `struct ggml_tensor`, so
# the ggml must be compiled with the same value. This is the one place it is set.
#
# llama-cpp-sys-2 passes GGML_* and CMAKE_* variables to CMake (and reruns its
# build when a GGML_* variable changes); CMake includes ggml.cmake right after
# `project(llama.cpp)`, which turns the value into a compile definition.
# whisper.cpp (whisper-rs-sys, patched in vendor/) links the same ggml; its build
# script reads GGML_MAX_NAME and compiles whisper.cpp with it (shared-ggml.cmake).
GGML_MAX_NAME = "128"
"CMAKE_PROJECT_llama.cpp_INCLUDE" = { value = "crates/music-ace/ggml.cmake", relative = true }
