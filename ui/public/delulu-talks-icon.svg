<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Delulu Talks</title>
  <desc id="desc">A luminous voice ribbon forms a lowercase d and a speech tail on a deep-sea tile.</desc>
  <defs>
    <linearGradient id="voice" x1="54" y1="64" x2="207" y2="207" gradientUnits="userSpaceOnUse"><stop stop-color="#c4f8ff"/><stop offset=".5" stop-color="#6ad9ff"/><stop offset="1" stop-color="#32baff"/></linearGradient>
    <linearGradient id="depth" x1="128" y1="8" x2="128" y2="248" gradientUnits="userSpaceOnUse"><stop stop-color="#11406a"/><stop offset=".52" stop-color="#082742"/><stop offset="1" stop-color="#041424"/></linearGradient>
    <radialGradient id="light" cx="86" cy="18" r="190" gradientUnits="userSpaceOnUse"><stop stop-color="#75e4ff" stop-opacity=".3"/><stop offset="1" stop-color="#75e4ff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="62" fill="url(#depth)"/>
