[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
delulu-core = { path = "crates/delulu-core", features = ["tokio"] }
delulu-domain = { path = "crates/delulu-domain" }
delulu-runtime = { path = "crates/delulu-runtime" }
delulu-audio = { path = "crates/delulu-audio" }
delulu-desktop = { path = "crates/delulu-desktop" }
delulu-data = { path = "crates/delulu-data" }
delulu-speech = { path = "crates/delulu-speech" }
delulu-voice = { path = "crates/delulu-voice" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
regex = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
log = "0.4"
tempfile = "3"
which = "7"
dirs = "6"

[package]
name = "delulu-talks"
description = "Private, local-first system-wide dictation with CPU, CUDA and MLX speech models"
authors = ["JoranEMostert"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "delulu_talks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde.workspace = true
serde_json.workspace = true
delulu-core.workspace = true
delulu-domain.workspace = true
delulu-runtime.workspace = true
delulu-audio.workspace = true
delulu-desktop.workspace = true
delulu-data.workspace = true
delulu-speech.workspace = true
delulu-voice.workspace = true
tokio.workspace = true
parking_lot.workspace = true
log.workspace = true
sha2.workspace = true
hex.workspace = true
tokio-util = "0.7"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Login items on macOS and Windows; Linux writes an XDG autostart entry.
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
