[package]
name = "delulu-speech"
description = "Speech and rewriting runtimes, the dictation pipeline, paste-last and the import transcription hook for Delulu Talks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
delulu-core.workspace = true
delulu-domain.workspace = true
delulu-runtime.workspace = true
delulu-audio.workspace = true
delulu-desktop.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
parking_lot.workspace = true
log.workspace = true
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1"
tokio-util = "0.7"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
