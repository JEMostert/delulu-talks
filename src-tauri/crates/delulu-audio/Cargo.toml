[package]
name = "delulu-audio"
description = "Native microphone capture, resampling, WAV encoding, trailing silence, capture cues, listening VAD and voice playback for Delulu Talks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
delulu-core.workspace = true
serde.workspace = true
parking_lot.workspace = true
log.workspace = true
# cpal 0.18.2 plus RustAudio/cpal#1387: a fixed-size PulseAudio record stream
# no longer caps max_length at one fragment (which stalls or drops audio).
# Fixed buffers are required on Pulse: with server defaults the first record
# fragment (and so `play()`) takes ~2 s, and PulseAudio's default playback
# target is 2 s, which would delay stopping speech.
# Swap back to `cpal` once a release includes #1387.
cpal = { package = "handy-cpal", version = "=0.18.2" }
ringbuf = "0.4"
crossbeam-channel = "0.5"

# PulseAudio (pipewire-pulse) first, ALSA when no Pulse server answers.
# CoreAudio and WASAPI are cpal's defaults on macOS and Windows.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { package = "handy-cpal", version = "=0.18.2", features = ["pulseaudio"] }

[dev-dependencies]
serde_json.workspace = true
