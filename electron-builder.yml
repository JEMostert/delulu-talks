linux:
  category: AudioVideo
  executableName: delulu-talks
  icon: build/icon.png
  syncDesktopName: true
  target:
    - AppImage
    - pacman
    - tar.xz
  desktop:
    entry:
      Name: Delulu Talks
      Comment: Private local dictation with R2T2
      Categories: AudioVideo;Utility;
      Keywords: dictation;speech;transcription;whisper;voice;
      StartupWMClass: delulu-talks
pacman:
  depends:
    - c-ares
    - ffmpeg
    - gtk3
    - http-parser
    - libevent
    - libvpx
    - libxslt
    - libxss
    - minizip
    - nss
    - re2
    - snappy
    - libnotify
    - gtk4-layer-shell
    - python-gobject
    - python-cairo
mac:
  category: public.app-category.productivity
  minimumSystemVersion: "15.0"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Delulu Talks records your voice for private, local dictation.
    NSAppleEventsUsageDescription: Delulu Talks pastes your transcript into the application you are using.
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: Delulu-Talks-${version}-${os}-${arch}.${ext}
