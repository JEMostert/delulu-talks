appId: com.joran.delulu-talks
productName: Delulu Talks
asar: true
npmRebuild: false
directories:
  output: release
electronUpdaterCompatibility: ">=2.16"
publish:
  provider: github
  owner: JEMostert
  repo: delulu-talks
toolsets:
  appimage: "1.0.3"
files:
