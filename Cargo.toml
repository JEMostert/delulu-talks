[workspace]
members = ["crates/*", "src-tauri"]
exclude = ["vendor"]
resolver = "2"
[workspace.package]
version = "1.8.0"
edition = "2021"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["full"] }
handy-cpal = { version = "=0.18.2" }
rubato = "0.16"
# delulu-engine only (the `stt` role).
whisper-rs = { version = "=0.16.0" }
# The cleanup helper only. No openmp (no libgomp at runtime) and no `common`.
llama-cpp-2 = { version = "=0.1.160", default-features = false }
libc = "0.2"
ureq = "3"
sha2 = "0.10"
arboard = { version = "3", features = ["wayland-data-control"] }
ashpd = { version = "0.13", features = ["tokio", "remote_desktop", "screencast", "global_shortcuts"] }
zbus = "5"
futures-util = "0.3"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
# Bundled SQLite with FTS5: history, its search index and vocabulary (crates/store).
rusqlite = { version = "0.43", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-build = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
gtk = "0.18"
cairo-rs = "0.18"
# The radio tests encode and measure real audio, far too slow unoptimized.
[profile.dev.package.opus1]
opt-level = 3
[profile.dev.package.ebur128]
opt-level = 3
# The recording pill draws 60 frames a second; unoptimized it is too slow to judge.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
# whisper.cpp against delulu-engine's one ggml: the crates.io whisper-rs-sys builds
# its own bundled ggml (see vendor/whisper-rs-sys/README.md).
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
