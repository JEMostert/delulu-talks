<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">How Delulu Talks works</title>
  <desc id="desc">Hold the hotkey and speak; Whisper turns speech into text on the GPU; Gemma removes filler words, adds punctuation, names the topic and fixes misheard terms from your vocabularies; the text is typed where your cursor is. The topic, matching vocabulary and last sentence flow back to Whisper for the next dictation.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2f48"/>
      <stop offset="1" stop-color="#03101d"/>
    </linearGradient>
    <linearGradient id="nacre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc2d1"/>
      <stop offset=".3" stop-color="#bfefff"/>
      <stop offset=".6" stop-color="#d9c9f2"/>
      <stop offset="1" stop-color="#f6dfb0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4766" stop-opacity=".75"/>
      <stop offset="1" stop-color="#0b2539" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="pearl" cx=".36" cy=".32" r=".75">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".5" stop-color="#ece6f4"/>
      <stop offset="1" stop-color="#9fb2cc"/>
    </radialGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#75e4ff"/>
    </marker>
    <marker id="headloop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f6c979"/>
    </marker>
  </defs>
  <rect width="1280" height="430" rx="28" fill="url(#water)"/>
  <rect x=".75" y=".75" width="1278.5" height="428.5" rx="27.5" fill="none" stroke="url(#nacre)" stroke-opacity=".3" stroke-width="1.5"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif">
    <!-- Flow arrows with a travelling pearl -->
    <g stroke="#75e4ff" stroke-width="2.5" fill="none" marker-end="url(#head)">
      <path d="M302 150 H338"/>
      <path d="M622 150 H658"/>
      <path d="M942 150 H978"/>
    </g>
    <circle r="6" fill="url(#pearl)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M170 150 H1110"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.92;1" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- 1 Speak -->
    <g transform="translate(48 70)">
      <rect width="254" height="160" rx="22" fill="url(#glass)"/>
      <rect x=".75" y=".75" width="252.5" height="158.5" rx="21.5" fill="none" stroke="url(#nacre)" stroke-opacity=".55"/>
      <g transform="translate(24 26)">
        <rect width="52" height="34" rx="8" fill="#eaf6ff"/>
        <rect y="0" width="52" height="30" rx="8" fill="#ffffff"/>
        <text x="26" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#0b2135">Super</text>
        <text x="64" y="23" font-size="18" fill="#a9c8de">+</text>
        <rect x="82" width="34" height="34" rx="8" fill="#eaf6ff"/>
        <rect x="82" width="34" height="30" rx="8" fill="#ffffff"/>
        <text x="99" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#0b2135">Z</text>
      </g>
      <text x="24" y="98" font-size="22" font-weight="700" fill="#eaf6ff">Hold and speak</text>
      <text x="24" y="124" font-size="15" fill="#a9c8de">Or tap to start, tap to stop.</text>
      <text x="24" y="145" font-size="15" fill="#a9c8de">Dutch or English.</text>
    </g>

    <!-- 2 Whisper -->
    <g transform="translate(340 70)">
      <rect width="282" height="160" rx="22" fill="url(#glass)"/>
      <rect x=".75" y=".75" width="280.5" height="158.5" rx="21.5" fill="none" stroke="url(#nacre)" stroke-opacity=".55"/>
      <g transform="translate(24 30)" fill="#75e4ff">
        <rect x="0" y="10" width="5" height="14" rx="2.5"/><rect x="9" y="4" width="5" height="26" rx="2.5"/><rect x="18" y="0" width="5" height="34" rx="2.5"/><rect x="27" y="7" width="5" height="20" rx="2.5"/><rect x="36" y="12" width="5" height="10" rx="2.5"/>
      </g>
      <text x="80" y="54" font-size="15" fill="#75e4ff">speech → text</text>
      <text x="24" y="98" font-size="22" font-weight="700" fill="#eaf6ff">Whisper</text>
      <text x="24" y="124" font-size="15" fill="#a9c8de">Large v3 Turbo on your GPU.</text>
      <text x="24" y="145" font-size="15" fill="#a9c8de">About 0.3 s for a sentence.</text>
    </g>

    <!-- 3 Gemma -->
    <g transform="translate(660 70)">
      <rect width="282" height="160" rx="22" fill="url(#glass)"/>
      <rect x=".75" y=".75" width="280.5" height="158.5" rx="21.5" fill="none" stroke="url(#nacre)" stroke-opacity=".55"/>
      <circle cx="44" cy="46" r="18" fill="url(#pearl)"/>
      <circle cx="38" cy="40" r="5" fill="#fff"/>
      <text x="74" y="42" font-size="15" fill="#f6c979">topic: programming</text>
      <text x="74" y="62" font-size="15" fill="#a9c8de">+ your vocabularies</text>
      <text x="24" y="98" font-size="22" font-weight="700" fill="#eaf6ff">Gemma cleanup</text>
      <text x="24" y="124" font-size="15" fill="#a9c8de">Fillers out, punctuation in,</text>
      <text x="24" y="145" font-size="15" fill="#a9c8de">misheard names fixed. ~0.2 s.</text>
    </g>

    <!-- 4 Typed -->
    <g transform="translate(980 70)">
      <rect width="252" height="160" rx="22" fill="url(#glass)"/>
      <rect x=".75" y=".75" width="250.5" height="158.5" rx="21.5" fill="none" stroke="url(#nacre)" stroke-opacity=".55"/>
      <rect x="24" y="26" width="150" height="34" rx="8" fill="#03101d" stroke="#75e4ff" stroke-opacity=".5"/>
      <text x="36" y="48" font-size="15" fill="#eaf6ff">GitHub.</text>
      <rect x="95" y="34" width="2" height="18" fill="#75e4ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <text x="24" y="98" font-size="22" font-weight="700" fill="#eaf6ff">Typed for you</text>
      <text x="24" y="124" font-size="15" fill="#a9c8de">Into the app you were in,</text>
      <text x="24" y="145" font-size="15" fill="#a9c8de">and saved in History.</text>
    </g>

    <!-- Smart context loop back to Whisper -->
    <path d="M800 232 C800 300, 760 312, 640 312 L520 312 C490 312, 481 290, 481 240" fill="none" stroke="#f6c979" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#headloop)">
      <animate attributeName="stroke-dashoffset" values="28;0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <text x="640" y="342" text-anchor="middle" font-size="16" font-weight="600" fill="#f6c979">Smart context: the topic, its vocabulary and your last sentence</text>
    <text x="640" y="364" text-anchor="middle" font-size="16" fill="#c9a86b">help Whisper on the next dictation. Forgotten after 10 quiet minutes.</text>

    <!-- Example -->
    <text x="48" y="402" font-size="15" fill="#6f93ad">heard: “uh push the fix to get hub”</text>
    <text x="1232" y="402" text-anchor="end" font-size="15" fill="#a9c8de">typed: “Push the fix to GitHub.”</text>
  </g>
</svg>
