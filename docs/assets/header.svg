<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Delulu Talks</title>
  <desc id="desc">A pearl floating in deep water under rays of light, beside the name Delulu Talks and the recording pill with its string of pearls.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3552"/>
      <stop offset=".45" stop-color="#062038"/>
      <stop offset="1" stop-color="#020b16"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe9ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#9fe9ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#75e4ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#75e4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pearl" cx=".36" cy=".32" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#f1eef4"/>
      <stop offset="1" stop-color="#a9b6cc"/>
    </radialGradient>
    <radialGradient id="rose" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffaac4" stop-opacity=".75"/><stop offset="1" stop-color="#ffaac4" stop-opacity="0"/></radialGradient>
    <radialGradient id="sea" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7fe6ff" stop-opacity=".75"/><stop offset="1" stop-color="#7fe6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="lilac" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c9b2ff" stop-opacity=".7"/><stop offset="1" stop-color="#c9b2ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gold" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe0a3" stop-opacity=".6"/><stop offset="1" stop-color="#ffe0a3" stop-opacity="0"/></radialGradient>
    <radialGradient id="limb" cx=".5" cy=".5" r=".5">
      <stop offset=".62" stop-color="#0a1830" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a1830" stop-opacity=".38"/>
    </radialGradient>
    <radialGradient id="spec" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bead" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#ffc4d2"/>
      <stop offset="1" stop-color="#b8566c"/>
    </radialGradient>
    <linearGradient id="nacre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc2d1"/>
      <stop offset=".3" stop-color="#bfefff"/>
      <stop offset=".6" stop-color="#d9c9f2"/>
      <stop offset="1" stop-color="#f6dfb0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="340" rx="28"/></clipPath>
    <clipPath id="ball"><circle cx="210" cy="170" r="92"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#water)"/>
    <!-- Light from the surface -->
    <g>
      <polygon points="260,0 330,0 520,340 380,340" fill="url(#ray)"/>
      <polygon points="430,0 470,0 640,340 560,340" fill="url(#ray)" opacity=".7"/>
      <polygon points="80,0 150,0 260,340 120,340" fill="url(#ray)" opacity=".8"/>
      <polygon points="760,0 800,0 930,340 860,340" fill="url(#ray)" opacity=".5"/>
      <polygon points="1040,0 1110,0 1210,340 1080,340" fill="url(#ray)" opacity=".6"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 0; 0 0" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- Rising bubbles -->
    <g fill="#9fe9ff" fill-opacity=".12" stroke="#d8f6ff" stroke-opacity=".55" stroke-width="1.2">
      <circle cx="330" cy="250" r="5"><animate attributeName="cy" values="360;-20" dur="7s" repeatCount="indefinite"/><animate attributeName="cx" values="330;338;326;334" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="120" r="3.5"><animate attributeName="cy" values="360;-20" dur="9s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="60" r="2.5"><animate attributeName="cy" values="360;-20" dur="6s" begin="-4s" repeatCount="indefinite"/></circle>
      <circle cx="1210" cy="90" r="4"><animate attributeName="cy" values="360;-20" dur="8s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="200" r="2.5"><animate attributeName="cy" values="360;-20" dur="10s" begin="-6s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="290" r="3"><animate attributeName="cy" values="360;-20" dur="11s" begin="-2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- The pearl -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="6s" repeatCount="indefinite"/>
      <ellipse cx="210" cy="172" rx="150" ry="140" fill="url(#pool)"/>
      <circle cx="210" cy="170" r="92" fill="url(#pearl)"/>
      <g clip-path="url(#ball)" filter="url(#soft)">
        <g>
          <circle cx="170" cy="200" r="70" fill="url(#rose)"/>
          <circle cx="255" cy="200" r="66" fill="url(#sea)"/>
          <circle cx="240" cy="125" r="60" fill="url(#lilac)"/>
          <circle cx="165" cy="130" r="50" fill="url(#gold)"/>
          <animateTransform attributeName="transform" type="rotate" values="0 210 170; 360 210 170" dur="24s" repeatCount="indefinite"/>
        </g>
      </g>
      <circle cx="210" cy="170" r="92" fill="url(#limb)"/>
      <ellipse cx="178" cy="134" rx="32" ry="26" fill="url(#spec)"/>
      <circle cx="246" cy="210" r="9" fill="#fff" fill-opacity=".4"/>
      <circle cx="210" cy="170" r="91" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
    </g>

    <!-- Name -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif">
      <text x="366" y="150" font-size="78" font-weight="800" letter-spacing="-3" fill="#eaf6ff">Delulu Talks</text>
      <text x="370" y="200" font-size="27" fill="#a9c8de">Hold a key, say it, and it’s typed.</text>
      <text x="370" y="238" font-size="19" fill="#6f93ad">Private dictation for Linux. Whisper and Gemma on your own GPU.</text>
    </g>

    <!-- The recording pill, listening -->
    <g transform="translate(944 252)">
      <rect x="0" y="0" width="236" height="56" rx="28" fill="#03101d" fill-opacity=".92"/>
      <rect x="1" y="1" width="234" height="54" rx="27" fill="none" stroke="url(#nacre)" stroke-opacity=".7" stroke-width="1.6"/>
      <circle cx="30" cy="28" r="24" fill="#ff6f86" fill-opacity=".22">
        <animate attributeName="r" values="20;27;20" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="28" r="15" fill="url(#pearl)"/>
      <circle cx="25" cy="22" r="4.5" fill="#fff"/>
      <path d="M58 28 H214" stroke="#ff6f86" stroke-opacity=".35" stroke-width="1.2"/>
      <g fill="url(#bead)">
        <circle cx="66" cy="28" r="4"><animate attributeName="cy" values="28;24;31;28" dur="1.1s" begin="0s" repeatCount="indefinite"/></circle>
        <circle cx="84" cy="28" r="5"><animate attributeName="cy" values="28;20;34;28" dur="1.1s" begin=".1s" repeatCount="indefinite"/></circle>
        <circle cx="102" cy="28" r="6"><animate attributeName="cy" values="28;17;37;28" dur="1.1s" begin=".2s" repeatCount="indefinite"/></circle>
        <circle cx="120" cy="28" r="6.5"><animate attributeName="cy" values="28;15;39;28" dur="1.1s" begin=".3s" repeatCount="indefinite"/></circle>
        <circle cx="138" cy="28" r="6.5"><animate attributeName="cy" values="28;16;38;28" dur="1.1s" begin=".4s" repeatCount="indefinite"/></circle>
        <circle cx="156" cy="28" r="6"><animate attributeName="cy" values="28;18;36;28" dur="1.1s" begin=".5s" repeatCount="indefinite"/></circle>
        <circle cx="174" cy="28" r="5"><animate attributeName="cy" values="28;21;33;28" dur="1.1s" begin=".6s" repeatCount="indefinite"/></circle>
        <circle cx="192" cy="28" r="4.5"><animate attributeName="cy" values="28;23;32;28" dur="1.1s" begin=".7s" repeatCount="indefinite"/></circle>
        <circle cx="208" cy="28" r="3.5"><animate attributeName="cy" values="28;25;30;28" dur="1.1s" begin=".8s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>
  <rect x=".75" y=".75" width="1278.5" height="338.5" rx="27.5" fill="none" stroke="url(#nacre)" stroke-opacity=".35" stroke-width="1.5"/>
</svg>
