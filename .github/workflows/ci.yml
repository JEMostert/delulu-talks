name: CI
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libvulkan-dev glslc spirv-headers clang
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Caches from before GGML_MAX_NAME (.cargo/config.toml) hold a ggml built
          # without it, and llama-cpp-sys-2 would not rebuild for it. Builds from
          # this key on track the variable and rebuild when it changes.
          key: ggml-max-name
      - run: bun install --frozen-lockfile
      - run: bash scripts/test-linux-updater.sh
      - name: Generated TypeScript protocol types are current
        run: cargo test -p delulu-proto --locked --test generated
      - run: bun run typecheck && bun run format:check && bun test ui && bun run build:web
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --bundles dmg
      - run: cargo test --release --locked -p delulu-talks --test updater
      - run: cargo test --release --locked -p delulu-core -p delulu-store -p delulu-engine -p delulu-desktop -p delulu-dictation -p delulu-voice-cli -p delulu-audio --lib --bins
      - run: cargo clippy --release --locked -p delulu-desktop -p delulu-voice-cli -p delulu-audio -- -D warnings
      - name: Verify the DMG and archive its application for Settings updates
        run: |
          mkdir macos-assets
          cp target/release/bundle/dmg/*.dmg macos-assets/
          bash scripts/verify-macos.sh macos-assets/*.dmg macos-assets/Delulu-Talks_aarch64.app.tar.gz
      - run: bash scripts/test-macos-update.sh macos-assets/*.app.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: macos-assets/*
          if-no-files-found: error
