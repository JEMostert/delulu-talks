name: Verify Electron app

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, test, and build
        run: |
          bun run typecheck
          bun test
          bun run build

      - name: Validate Python worker
        run: python3 -m py_compile electron/python/transcription_engine.py
