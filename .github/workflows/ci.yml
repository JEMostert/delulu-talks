name: Verify Electron app

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, test, and build
        run: |
          bun run format:check
          bun test
          bun run build

      - name: Validate Python worker
        run: |
          python3 -m py_compile electron/python/transcription_engine.py electron/python/metal_speech.py electron/python/speech_engine.py
          python3 -m unittest discover -s electron/python -p '*_test.py'

      - name: Install browser test runtime
        run: bunx playwright install --with-deps chromium

      - name: Verify browser workflows
        run: bun run test:e2e

      - name: Verify isolated Electron desktop
        run: xvfb-run --auto-servernum node scripts/desktop-smoke.mjs
