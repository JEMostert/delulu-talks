name: CI
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libvulkan-dev glslc spirv-headers clang
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run format:check && bun test ui && bun run build:web
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
