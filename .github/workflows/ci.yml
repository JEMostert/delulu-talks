name: Verify Electron app

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, test, and build
        run: |
          bun run format:check
          bun run test
          bun run build

      - name: Validate Python worker
        run: |
          python3 -m py_compile electron/python/transcription_engine.py electron/python/metal_speech.py electron/python/speech_engine.py
          bun run test:python

      - name: Install browser test runtime
        run: bunx playwright install --with-deps chromium

      - name: Verify browser workflows
        run: bun run test:e2e

      - name: Verify isolated Electron desktop
        run: xvfb-run --auto-servernum node scripts/test-evidence.mjs desktop

      - name: Verify isolated local data inventory
        run: xvfb-run --auto-servernum node scripts/local-data-smoke.mjs

      - name: Verify isolated deletion and reset
        run: xvfb-run --auto-servernum node scripts/test-evidence.mjs data-deletion

      - name: Summarize verification evidence
        if: always()
        run: bun run test:evidence

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: artifacts/verification/
          if-no-files-found: warn
