name: Build Electron release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            args: --linux AppImage pacman tar.xz --x64
            package-dir: release/linux-unpacked
            platform: linux
          - os: macos-latest
            name: mac-arm64
            args: --mac dmg zip --arm64
            package-dir: release/mac-arm64/Delulu Talks.app
            platform: mac
          - os: windows-latest
            name: windows-x64
            args: --win nsis zip --x64
            package-dir: release/win-unpacked
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libarchive-tools libopenjp2-tools

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application after verification
        run: bun run build

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(bun -p "require('./package.json').version")"

      - name: Build native packages
        run: bunx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Apple Silicon package
        if: runner.os == 'macOS'
        run: |
          test -f "release/mac-arm64/Delulu Talks.app/Contents/Resources/python/metal_speech.py"
          file "release/mac-arm64/Delulu Talks.app/Contents/MacOS/Delulu Talks" | grep arm64

      - name: Verify packaged resources
        run: bun scripts/package-resources.mjs "${{ matrix.package-dir }}" "${{ matrix.platform }}"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: delulu-talks-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.pacman
            release/*.tar.xz
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: delulu-talks-*
          merge-multiple: true

      - name: Verify complete release and updater checksums
        run: bun scripts/verify-release.mjs artifacts

      - name: Upload complete draft release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body_path: docs/releases/${{ github.ref_name }}.md
          name: Delulu Talks ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
