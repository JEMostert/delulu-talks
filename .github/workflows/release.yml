name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor low enough for the AppImage and deb.
          - os: ubuntu-22.04
            name: linux-x64
            args: --verbose
          - os: macos-latest
            name: mac-arm64
            args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev patchelf rpm libfuse2
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac-arm64' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Build and upload to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's bundled strip cannot read newer ELF sections.
          NO_STRIP: "true"
          # linuxdeploy is itself an AppImage; run it without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Delulu Talks ${{ github.ref_name }}
          releaseBody: See the release notes in docs/releases.
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: Check bundled resources
        shell: bash
        run: bun scripts/package-resources.mjs src-tauri/target ${{ matrix.name }}
      - name: Keep the Linux deb for the pacman package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  pacman:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: packaging/arch
      - name: Build the pacman package from the deb
        run: |
          pacman -Syu --noconfirm --needed github-cli
          useradd -m builder
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/@VERSION@/${version}/" packaging/arch/PKGBUILD
          chown -R builder packaging/arch
          cd packaging/arch
          sudo -u builder makepkg --nodeps --noconfirm
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" packaging/arch/*.pkg.tar.zst --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [build, pacman]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/verify-release.mjs "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
