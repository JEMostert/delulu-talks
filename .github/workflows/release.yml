name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    runs-on: ubuntu-24.04
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libvulkan-dev glslc clang patchelf rpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - if: github.event_name == 'workflow_dispatch'
        run: bun run tauri build --bundles deb,rpm
      - if: github.event_name != 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Delulu Talks ${{ github.ref_name }}
          releaseDraft: true
          args: --bundles deb,rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error
  pacman:
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: bundles
      - run: |
          useradd -m builder
          version=$(node -p 'require("./package.json").version' 2>/dev/null || sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -1)
          sed -i "s/@VERSION@/${version}/" packaging/arch/PKGBUILD
          cp bundles/deb/*.deb packaging/arch/
          chown -R builder packaging/arch
          cd packaging/arch
          su builder -c 'makepkg --nodeps --noconfirm'
      - uses: actions/upload-artifact@v4
        with:
          name: pacman
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, pacman]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - run: node scripts/verify-release.mjs bundles
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" bundles/pacman/*.pkg.tar.zst --clobber
          gh release edit "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --draft=false
