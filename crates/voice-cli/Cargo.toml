[package]
name = "delulu-voice-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "delulu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
# The registry (with the voice names) and downloader, and the engine protocol. Not
# delulu-tts: the model and ONNX Runtime stay in delulu-engine.
delulu-models = { path = "../models" }
delulu-proto = { path = "../proto" }
