[package]
name = "delulu-daemon"
version.workspace = true
edition.workspace = true
description = "The Delulu Talks daemon and its command line client."

# Named `delulud` for now: `crates/voice-cli` still ships the `delulu` binary
# (speak/setup/install-model/status). The two merge when speech moves into the
# daemon (work package D3).
[[bin]]
name = "delulud"
path = "src/main.rs"

[dependencies]
delulu-audio = { path = "../audio" }
delulu-cleanup = { path = "../cleanup" }
delulu-core = { path = "../core" }
delulu-desktop = { path = "../desktop" }
delulu-dictation = { path = "../dictation" }
delulu-models = { path = "../models" }
# Only the client that drives the pill (`delulu-pill`, else the app's `--pill`); no GTK.
delulu-overlay = { path = "../overlay", default-features = false }
delulu-proto = { path = "../proto" }
delulu-store = { path = "../store" }
delulu-stt = { path = "../stt" }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
log.workspace = true
zbus.workspace = true
# Only what the daemon uses; no `full`, so no blocking-pool extras or fs.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "time", "macros"] }
