[package]
name = "delulu-overlay"
version.workspace = true
edition.workspace = true
[dependencies]
delulu-pill = { path = "../pill", default-features = false }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { workspace = true, optional = true }
cairo-rs = { workspace = true, optional = true }

[features]
default = ["helper"]
# The GTK `--pill` helper, the fallback when the native `delulu-pill` is missing
# or cannot draw. It paints `delulu-pill`'s frames. Without it the crate only
# drives a pill, so the daemon can show one without linking GTK.
helper = ["dep:gtk", "dep:cairo-rs", "delulu-pill/render"]
